    <text x="1383" y="252" fill="#F0F4FB" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="44" font-weight="700">JQ</text>
    <text x="1383" y="346" fill="#AAB2C1" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="400">Systems builder</text>
