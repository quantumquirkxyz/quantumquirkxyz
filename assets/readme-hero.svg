<svg width="1600" height="760" viewBox="0 0 1600 760" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">quantumquirkxyz README header</title>
  <desc id="desc">Dark dashboard-style hero for the GitHub README.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="760" gradientUnits="userSpaceOnUse">
      <stop stop-color="#060606"/>
      <stop offset="1" stop-color="#0B0F17"/>
    </linearGradient>
    <linearGradient id="accent" x1="360" y1="170" x2="760" y2="170" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6EA8FF"/>
      <stop offset="1" stop-color="#4D7CFE"/>
    </linearGradient>
    <linearGradient id="panel" x1="980" y1="110" x2="1530" y2="620" gradientUnits="userSpaceOnUse">
      <stop stop-color="#11151D"/>
      <stop offset="1" stop-color="#090C12"/>
    </linearGradient>
    <linearGradient id="ring" x1="1180" y1="170" x2="1450" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6EA8FF"/>
      <stop offset="1" stop-color="#355DDE"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="1 0 0 0 0.18  0 1 0 0 0.34  0 0 1 0 0.78  0 0 0 0.5 0"/>
    </filter>
  </defs>

  <rect x="8" y="8" width="1584" height="744" rx="20" fill="url(#bg)" stroke="#1B2230"/>
  <rect x="8" y="8" width="1584" height="58" rx="20" fill="#070707" stroke="#1B2230"/>
  <path d="M8 46C8 34.9543 16.9543 26 28 26H1580C1591.05 26 1600 34.9543 1600 46V66H8V46Z" fill="#070707"/>

  <text x="40" y="42" fill="#6EA8FF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="600">quantumquirkxyz</text>
  <text x="181" y="42" fill="#98A2B3" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="400">/ README.md</text>
  <path d="M1546 29L1572 55" stroke="#C8D0DD" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M1544 55L1570 29" stroke="#C8D0DD" stroke-width="2.2" stroke-linecap="round"/>

