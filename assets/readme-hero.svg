  <rect x="28" y="674" width="1544" height="1" fill="#1A2130"/>
  <text x="800" y="712" fill="#AAB2C1" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="400">
