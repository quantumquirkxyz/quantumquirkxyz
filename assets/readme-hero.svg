  <path d="M1260 124V392" stroke="#273042"/>
  <text x="1018" y="152" fill="#F2F5FA" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="600">GitHub Snapshot</text>
  <g fill="#C8D0DD" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="400">
